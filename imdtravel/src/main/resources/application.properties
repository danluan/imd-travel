server.port=${PORT:8080}
spring.main.banner-mode=off
# R-13: o único log é o JSON do JsonLogger; todo log de texto do Spring/Hibernate fica desligado.
logging.level.root=OFF

spring.datasource.url=jdbc:sqlite:${imdtravel.sales-dir}/sales.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# D-06: o SQLite aceita um escritor por vez; com mais conexões, inserts concorrentes
# dão SQLITE_BUSY. Restrição do banco, não limite de concorrência na entrada (R-20).
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
# D-07: nenhuma sessão/conexão presa durante as chamadas HTTP da compra.
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

imdtravel.airlineshub-url=${AIRLINESHUB_URL:http://localhost:8081}
imdtravel.exchange-url=${EXCHANGE_URL:http://localhost:8082}
imdtravel.fidelity-url=${FIDELITY_URL:http://localhost:8083}
imdtravel.sales-dir=${SALES_DIR:./data}
